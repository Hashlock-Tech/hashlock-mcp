# Smithery.ai config for the Hashlock MCP server.
# Published: https://www.npmjs.com/package/@hashlock-tech/mcp
# Source:    https://github.com/Hashlock-Tech/hashlock-mcp
# Registry:  io.github.Hashlock-Tech/hashlock

runtime: "stdio"
start:
  command: "npx"
  args: ["-y", "@hashlock-tech/mcp"]

config:
  type: "object"
  properties:
    HASHLOCK_EVM_KEY:
      type: "string"
      title: "Agent EVM private key (testnet)"
      description: >-
        0x private key for autonomous SIWE login — the server signs the login
        itself and re-authenticates on expiry. Use a dedicated TESTNET key.
    HASHLOCK_TOKEN:
      type: "string"
      title: "Hashlock JWT"
      description: "A ready JWT (alternative to HASHLOCK_EVM_KEY)."
    HASHLOCK_API_URL:
      type: "string"
      title: "REST API endpoint"
      description: "Override the Hashlock Markets REST API endpoint."
      default: "https://dev.hashlock.markets/api"

metadata:
  name: "Hashlock Markets"
  description: >-
    The settlement layer for the agent economy. Non-custodial cross-chain OTC:
    sealed RFQ + price negotiation + HTLC atomic settlement — both legs settle
    or both refund; no bridge, no custodian, no counterparty risk. BTC ↔ EVM /
    TRON. TESTNETS ONLY for now (Ethereum Sepolia, TRON Nile, Bitcoin signet).
    Autonomous-agent ready: SIWE login with the agent's own key; swap secrets
    generated locally. 14 tools: list_assets, list_open_rfqs, get_rfq,
    create_rfq, cancel_rfq, respond_to_rfq, negotiate, my_rfqs, my_deals,
    deal_status, set_settlement_address, get_deal_secret, reveal_claim, whoami.
  homepage: "https://hashlock.markets"
  repository: "https://github.com/Hashlock-Tech/hashlock-mcp"
  license: "MIT"
  categories:
    - "finance"
    - "defi"
    - "agents"
    - "trading"
  tags:
    - "agent-economy"
    - "agent-native"
    - "atomic-settlement"
    - "htlc"
    - "atomic-swap"
    - "cross-chain"
    - "rfq"
    - "otc"
    - "bitcoin"
    - "ethereum"
    - "tron"
    - "testnet"
