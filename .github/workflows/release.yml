name: Release

# Publish @hashlock-tech/mcp on a version tag: `git tag v0.5.0 && git push origin v0.5.0`.
# Build runs WITHOUT OIDC; only the minimal `publish` job holds `id-token: write` and publishes the
# prebuilt tarball (no untrusted install/build in the privileged job). OIDC Trusted Publishing — no
# long-lived token in the repo; configure the npm trusted publisher once against this file (release.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (no OIDC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 — reads the version from packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack # → *.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    name: Publish to npm (OIDC)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → npm trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node whose bundled npm (11.16.0) already satisfies OIDC trusted publishing (>= 11.5.1) — no
          # registry-supplied `npm install -g` runs in the privileged job. npm publishes the prebuilt tarball.
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - run: npm publish *.tgz --provenance --access public

  # The GitHub Releases page is where people look first, and it used to be filled in by hand: 1.12.0 and 1.12.1
  # went to npm and the MCP Registry while the page still called 1.11.1 the latest (2026-11-10). After npm took
  # the package, the tag gets its release here too — a pre-release tag (x.y.z-…) marked as one, a stable one as
  # the latest unless a newer one exists. A release that already exists for the tag is left as it is, so a re-run
  # does not fail.
  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 0; fi
          case "$TAG" in
            *-*) gh release create "$TAG" --verify-tag --generate-notes --prerelease ;;
            # Latest only if no newer stable release exists — a hotfix of an older line (1.11.2 after 1.12.1) must
            # not take the badge, the same rule mcp-registry-deprecate.yml keeps by sort -V.
            *) CUR=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
               if [ -z "$CUR" ] || [ "$(printf '%s\n%s\n' "$CUR" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then L=--latest; else L=--latest=false; fi
               gh release create "$TAG" --verify-tag --generate-notes "$L" ;;
          esac
