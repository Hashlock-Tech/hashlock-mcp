name: MCP Registry — deprecate old versions

# Marks every registry version of io.github.Hashlock-Tech/hashlock but the NEWEST as deprecated. Runs after
# every publish (called from mcp-registry.yml), so a release leaves one active version without anyone
# remembering to; before that it was a manual step, and 1.10.0–1.11.1 sat active beside 1.12.0. It can still
# be dispatched by hand.
# Same auth as mcp-registry.yml (GitHub OIDC proves the io.github.Hashlock-Tech namespace) — a personal
# `mcp-publisher login github` gets 403 unless that user's org membership is visible to the registry.
on:
  workflow_dispatch:
    inputs:
      published:
        description: 'A version just published that the registry list may not show yet (optional)'
        required: false
  workflow_call:
    inputs:
      published:
        description: 'The version the caller just published'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Install mcp-publisher (pinned + checksum)
        run: |
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Deprecate every version except the newest
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          set -euo pipefail
          N=io.github.Hashlock-Tech/hashlock
          # This server's versions only: the search matches by substring, and another server's higher version
          # would be picked as the one to keep.
          versions=$(curl -sf --retry 3 --retry-all-errors "https://registry.modelcontextprotocol.io/v0/servers?search=$N&limit=100" \
            | jq -r --arg n "$N" '.servers[]|(.server // .)|select(.name == $n)|.version')
          # The ONE version that stays active is the newest stable one — of those listed and the one just
          # published, which the list may not show yet. A patch on an older line is therefore deprecated on
          # release, like every other superseded version.
          KEEP=$(printf '%s\n' $versions "$PUBLISHED" | { grep -Ex '[0-9]+\.[0-9]+\.[0-9]+' || true; } | sort -V | tail -1)
          [ -n "$KEEP" ] || { echo "::error::no published version found"; exit 1; }
          echo "keeping $KEEP"
          ./mcp-publisher login github-oidc
          for v in $versions; do
            [ "$v" = "$KEEP" ] && continue
            # Versions already deprecated are skipped. The per-version endpoint is the one that reports status
            # (the search list shows every version as active).
            status=$(curl -sf --retry 3 --retry-all-errors "https://registry.modelcontextprotocol.io/v0/servers/${N/\//%2F}/versions/$v" \
              | jq -r '._meta["io.modelcontextprotocol.registry/official"].status // empty') || status=
            [ "$status" = deprecated ] && continue
            echo "deprecating $v (status: ${status:-unreadable})"
            # A version deprecated in the meantime answers 400 "No changes to apply" — already done, not a failure.
            if ! out=$(./mcp-publisher status --status deprecated \
              --message "Superseded — use the latest version (hosted at https://hashlock.markets/mcp)" "$N" "$v" 2>&1); then
              echo "$out"
              grep -q "No changes to apply" <<<"$out" && continue
              # Some old versions answer every call with 500 (0.1.14 on 2026-10-15). Only a version whose status
              # could not be read either is passed over; a readable active version that will not deprecate fails.
              if [ -z "$status" ]; then echo "::warning::$v: status unreadable and deprecate failed — skipped"; continue; fi
              exit 1
            fi
          done
