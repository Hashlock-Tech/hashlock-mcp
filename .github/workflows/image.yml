name: Image

# Build + push the hosted (Streamable HTTP) MCP image. The npm package is the LOCAL stdio server and is
# released separately by release.yml; this image runs the `hashlock-mcp-http` entry only.
on:
  push:
    branches: [main, develop]
    paths: ['src/**', 'Dockerfile', 'package.json', 'pnpm-lock.yaml', 'tsup.config.ts', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hashlock-tech/hashlock-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what the deploy pulls; :sha for traceability.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
